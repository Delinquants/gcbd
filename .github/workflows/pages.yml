name: Pages build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GH-pages
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Install dependencies
        run: pnpm run-script lint

      - name: Build static website
        run: pnpm run-script build -c vite.static.ts

      - name: Upload gh-pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'build/'

  pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.deploy == 'true' || github.ref == 'refs/heads/master'

    permissions:
      id-token: write
      pages: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
